<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#181a26" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong Glow Filter for lines -->
    <filter id="strong-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComponentTransfer in="blur" result="boostedBlur">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boostedBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Box Filling Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.1)" />
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1f2336" stroke-width="6" />

  <!-- Background Decorative Grid Lines (Subtle) -->
  <path d="M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512 M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384" 
        stroke="rgba(255, 255, 255, 0.03)" stroke-width="2" />

  <!-- Captured Box (Top Left Square 128x128 to 256x256) -->
  <rect x="128" y="128" width="128" height="128" rx="12" fill="url(#boxGrad)" opacity="0.8" />
  <text x="192" y="206" font-family="'Outfit', 'Space Grotesk', sans-serif" font-size="64" font-weight="800" fill="#00f0ff" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">D</text>

  <!-- Grid Lines (Completed) -->
  <!-- Horizontal completed top -->
  <line x1="128" y1="128" x2="256" y2="128" stroke="#00f0ff" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <!-- Horizontal completed bottom -->
  <line x1="128" y1="256" x2="256" y2="256" stroke="#00f0ff" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <!-- Vertical completed left -->
  <line x1="128" y1="128" x2="128" y2="256" stroke="#00f0ff" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <!-- Vertical completed right -->
  <line x1="256" y1="128" x2="256" y2="256" stroke="#00f0ff" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />

  <!-- Glowing Active Line Under Construction (256,256 to 384,256) -->
  <line x1="256" y1="256" x2="384" y2="256" stroke="#a855f7" stroke-width="10" stroke-linecap="round" filter="url(#strong-glow)" />

  <!-- Dots Grid (Rows of Dots) -->
  <!-- Row 1 -->
  <circle cx="128" cy="128" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="128" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="384" cy="128" r="14" fill="#6c7a9c" />

  <!-- Row 2 -->
  <circle cx="128" cy="256" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" stroke="#a855f7" stroke-width="4" filter="url(#glow)" />
  <circle cx="384" cy="256" r="18" fill="#ffffff" stroke="#a855f7" stroke-width="4" filter="url(#glow)" />

  <!-- Row 3 -->
  <circle cx="128" cy="384" r="14" fill="#6c7a9c" />
  <circle cx="256" cy="384" r="14" fill="#6c7a9c" />
  <circle cx="384" cy="384" r="14" fill="#6c7a9c" />
</svg>
